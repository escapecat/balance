<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>挑一套配色</title>
<!--
  ⚠️ 一次性对比页,不是产品的一部分。选定之后删掉。

  「统计界面的颜色组合有点丑」—— 而「丑」我猜不准。
  与其改一版推一版让你反复看,不如把候选并排画出来,
  用**同一份真实结构**(环形图 + 堆叠柱 + 进度条)渲染,
  你指一个我就把它写进 style.css。

  ⚠️ 这里的百分比是**编的**(20/10/10/20/30/10),不是你的持仓 ——
     仓库是公开的,配色页不需要真数据。
-->
<style>
  body { font: 15px/1.6 system-ui, "PingFang SC", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 20px;
         background: #f5f6f8; color: #16181d; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .lead { color: #656c78; font-size: 13px; margin: 0 0 20px; }
  .set { background: #fff; border: 1px solid #e2e5ea; border-radius: 14px;
         padding: 16px; margin-bottom: 16px; }
  .set h2 { font-size: 15px; margin: 0 0 2px; }
  .set .why { font-size: 12px; color: #656c78; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px;
            color: #656c78; margin-top: 10px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block;
              margin-right: 5px; }
  .bars { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .brow { font-size: 12px; }
  .btrack { height: 6px; border-radius: 999px; background: #e4e7ec; margin-top: 4px; }
  .btrack i { display: block; height: 100%; border-radius: 999px; }
  .dark { background: #1c1f25; border-color: #2e333b; color: #e9ebef; }
  .dark .why, .dark .legend { color: #9aa1ac; }
  .dark .btrack { background: #31363f; }
  .pickbtn { margin-top: 14px; font: inherit; font-size: 13px; padding: 8px 14px;
             border-radius: 999px; border: 1px solid #cfd4dc; background: #fff;
             cursor: pointer; }
  .note { font-size: 12px; color: #656c78; margin-top: 24px; }
</style>
</head>
<body>

<h1>挑一套配色</h1>
<p class="lead">三套都用同一份结构画:环形图 · 堆叠柱 · 进度条。
每套下面还有一个深色版 —— <b>夜里那套是另一组颜色</b>,白天好看的压在深底上常常糊掉。</p>

<div id="out"></div>

<p class="note">告诉我编号就行。选定后这一页删掉。</p>

<script>
// 六类 + 现金,占比是编的
var CATS = ['标普500', '纳指100', '黄金', '红利低波', '中长债', '中短债', '现金'];
var PCT  = [.20, .10, .10, .20, .25, .10, .05];

var SETS = [
  {
    name: '1 · 现在这套',
    why: '按资产性质给色,但六个色相跨度太大、明度又接近 —— 一圈下来像调色盘。',
    light: ['#3059c2', '#0d8593', '#bf8618', '#9c4478', '#2c8657', '#679b45', '#7c8390'],
    dark:  ['#7d9cf0', '#3fb9c7', '#e0ad4f', '#d081ad', '#5cbc86', '#9ccb75', '#99a1ad'],
  },
  {
    name: '2 · 一套蓝,深浅分档',
    why: '同一个色相从深到浅排开,只有黄金和现金跳出来。' +
         '最安静,代价是相邻两类要靠位置区分,不能光靠颜色。',
    light: ['#1b3f6b', '#2c6099', '#4a86c4', '#7aa9d8', '#b0851f', '#a8b4c2', '#8b929e'],
    dark:  ['#8fb4e0', '#6f9ed4', '#5b8cc4', '#a8c8e8', '#e0b355', '#7d8896', '#99a1ad'],
  },
  {
    name: '3 · 按资产分组,组内深浅',
    why: '权益一族蓝、债券一族绿、黄金金、现金灰;组内靠深浅分。' +
         '明度和饱和度统一过,不会有哪一块特别跳。',
    light: ['#2d5aa8', '#4d84c9', '#8a6fb0', '#b8862a', '#2f7d5e', '#5aa37b', '#8b929e'],
    dark:  ['#7ba3e0', '#a3c4ee', '#b096d4', '#dcae5c', '#5fb391', '#8ccbae', '#a0a7b3'],
  },
];

function donut(colors, size) {
  var R = 46, C = 2 * Math.PI * R, cx = 60, cy = 60, off = 0, out = '';
  PCT.forEach(function (p, i) {
    out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" ' +
           'stroke="' + colors[i] + '" stroke-width="18" ' +
           'stroke-dasharray="' + (p * C - 1.5) + ' ' + C + '" ' +
           'stroke-dashoffset="' + (-off * C) + '" ' +
           'transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    off += p;
  });
  return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '">' + out + '</svg>';
}

// 堆叠柱:四期,占比小幅漂移,看相邻色叠在一起会不会糊
function stacked(colors) {
  var W = 300, H = 110, bw = 44, out = '';
  for (var k = 0; k < 4; k++) {
    var x = 12 + k * 72, y = 0;
    PCT.forEach(function (p, i) {
      var pp = p * (1 + (((i + k) % 3) - 1) * .12);
      var hgt = pp * H;
      out += '<rect x="' + x + '" y="' + y.toFixed(1) + '" width="' + bw +
             '" height="' + hgt.toFixed(1) + '" fill="' + colors[i] + '"/>';
      y += hgt;
    });
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="110">' + out + '</svg>';
}

function block(set, mode) {
  var colors = set[mode];
  var legend = CATS.map(function (c, i) {
    return '<span><i style="background:' + colors[i] + '"></i>' + c + '</span>';
  }).join('');
  var bars = CATS.map(function (c, i) {
    return '<div class="brow">' + c +
           '<div class="btrack"><i style="width:' + (35 + i * 9) + '%;background:' +
           colors[i] + '"></i></div></div>';
  }).join('');
  return '<div class="set' + (mode === 'dark' ? ' dark' : '') + '">' +
    '<h2>' + set.name + (mode === 'dark' ? ' —— 深色模式' : '') + '</h2>' +
    '<p class="why">' + (mode === 'dark' ? '同一套色的夜间版本。' : set.why) + '</p>' +
    '<div class="grid"><div>' + donut(colors, 140) + '</div>' +
    '<div>' + stacked(colors) + '</div></div>' +
    '<div class="legend">' + legend + '</div>' +
    '<div class="bars">' + bars + '</div>' +
    '</div>';
}

document.getElementById('out').innerHTML =
  SETS.map(function (s) { return block(s, 'light') + block(s, 'dark'); }).join('');
</script>
</body>
</html>
