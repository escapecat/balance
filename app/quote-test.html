<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行情接口能不能用</title>
<!--
  ⚠️ 这是个**一次性验证页**,不是产品的一部分。

  「打开时拉一次估值」这个功能依赖第三方行情接口,而我从命令行探测
  四个基金代码全部失败 —— 分不清是我的网络环境挡了,还是接口本身变了。

  **不能写一个自己验证不了的功能。** 所以先让浏览器实地试一次:
  浏览器的请求头、Referer、Cookie 环境和 curl 完全不同,
  而最终跑这段代码的正是浏览器。

  验证完这个文件就删掉。
-->
<style>
  body { font: 15px/1.6 system-ui, "PingFang SC", sans-serif;
         max-width: 680px; margin: 0 auto; padding: 24px; color: #16181d; }
  h1 { font-size: 19px; }
  .row { display: flex; gap: 10px; align-items: baseline;
         padding: 8px 0; border-top: 1px solid #e2e5ea; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; min-width: 6em; }
  .ok { color: #1d6b3f; } .bad { color: #b42318; } .wait { color: #656c78; }
  pre { background: #f5f6f8; padding: 12px; border-radius: 8px;
        overflow: auto; font-size: 12px; }
  .sum { margin-top: 20px; padding: 14px; border-radius: 8px; background: #f5f6f8; }
</style>
</head>
<body>

<h1>行情接口能不能用</h1>
<p>下面会用 JSONP 拉四只基金的实时估值。<b>JSONP 走 &lt;script&gt; 标签,不受 CORS 限制</b> ——
这是纯静态页面能拿到第三方数据的唯一办法。</p>

<div id="rows"></div>
<div class="sum" id="sum">测试中…</div>
<pre id="raw"></pre>

<script>
// 你的四只主力基金 + 一只老基金(000001 华夏成长,存在了十几年,当对照组)
var CODES = ['000001', '018738', '021778', '000216'];
var results = {};
var rows = document.getElementById('rows');
var raw = document.getElementById('raw');

CODES.forEach(function (code) {
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span class="code">' + code + '</span><span class="wait" id="s' + code + '">请求中…</span>';
  rows.appendChild(d);
});

function done(code, ok, msg) {
  results[code] = ok;
  var el = document.getElementById('s' + code);
  el.className = ok ? 'ok' : 'bad';
  el.textContent = (ok ? '✓ ' : '✗ ') + msg;
  summarize();
}

function summarize() {
  var got = Object.keys(results).length;
  if (got < CODES.length) return;
  var okN = CODES.filter(function (c) { return results[c]; }).length;
  var s = document.getElementById('sum');
  if (okN === CODES.length) {
    s.innerHTML = '<b>四个全通。</b>这个功能可以做 —— 把这一页的结果告诉我就行。';
  } else if (okN > 0) {
    s.innerHTML = '<b>通了 ' + okN + ' / ' + CODES.length + '。</b>' +
      '部分能用意味着有的基金拿不到估值(常见于新成立的联接基金)—— ' +
      '那种情况下工具必须**说清楚哪几只估不出来**,而不是当成没涨跌。';
  } else {
    s.innerHTML = '<b>一个都不通。</b>可能是网络环境挡了(公司网/代理),' +
      '也可能接口真的变了。<br>建议换个网络(手机流量)再打开一次这页 —— ' +
      '两次都不通的话,这条路就别走了。';
  }
}

// ⚠️ jsonpgz 是天天基金写死的回调名,不能改。
//    所以同一时刻只能有一个请求在飞 —— 串行发,不并发。
var queue = CODES.slice();
var timer = null;

window.jsonpgz = function (data) {
  clearTimeout(timer);
  var code = data && data.fundcode;
  if (!code) { next(); return; }
  raw.textContent += JSON.stringify(data) + '\n\n';
  done(code, true, (data.name || '') + '  净值 ' + data.dwjz +
                   '  估值 ' + data.gsz + '  (' + data.gszzl + '%)');
  next();
};

function next() {
  if (!queue.length) return;
  var code = queue.shift();
  var s = document.createElement('script');
  s.src = 'https://fundgz.1234567.com.cn/js/' + code + '.js?rt=' + Date.now();
  s.onerror = function () { done(code, false, '请求失败(网络挡了 / 接口不存在)'); next(); };
  // ⚠️ 超时也要处理:接口返回 200 但内容不是 jsonpgz 调用时,
  //    onerror 不会触发、回调也不会执行 —— 不设超时就永远停在「请求中」。
  timer = setTimeout(function () {
    done(code, false, '超时(返回了东西但不是估值数据)');
    next();
  }, 6000);
  document.body.appendChild(s);
}
next();
</script>
</body>
</html>
